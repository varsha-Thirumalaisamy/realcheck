    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="REALCHECK AI: Explainable Digital Media Authenticity & Forensic Analysis Platform for Images, Videos, Audio, and Text." />
    <meta name="theme-color" content="#060911" />
    <title>REALCHECK AI — Explainable Digital Authenticity & Forensic Analysis</title>
  </head>
  <body>
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = localTheme === 'dark' || localTheme === 'light' ? localTheme : systemTheme;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
